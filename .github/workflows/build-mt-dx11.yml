name: Build MT DX11 (demonized + brodrigz DLSS/FSR3)

on:
  workflow_dispatch:
  push:
    branches: [ "all-in-one-vs2022-wpo-mt" ]

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln

jobs:
  build_mt:
    name: build-mt ${{ matrix.buildconf }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        buildconf: ["DX11", "DX11-AVX"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{ matrix.buildconf }}
      run: msbuild /p:Configuration=${{ matrix.buildconf }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Upload Exe
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ matrix.buildconf }}_mt_exe
        path: ./_build/_game/bin_dbg/*.exe
        if-no-files-found: "error"
        retention-days: 14

    - name: Zip PDB
      run: |
        cd ./_build/_game/bin_dbg
        compress-archive -DestinationPath "STALKER-Anomaly-modded-exes_${{ matrix.buildconf }}_mt_pdb.zip" -Path "./*.pdb"

    - name: Upload PDB
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ matrix.buildconf }}_mt_pdb
        path: ./_build/_game/bin_dbg/*.zip
        if-no-files-found: "error"
        retention-days: 14
